name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pandas numpy SQLAlchemy
      - name: Compile modules
        run: python -m compileall -q task
      - name: Run tests
        working-directory: task
        run: python -m pytest -q
